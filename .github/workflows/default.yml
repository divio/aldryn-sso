name: Checks

on:
  push:
    branches:
    - master
  pull_request:

jobs:
  flake8:
    name: flake8
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install flake8
        run: pip install --upgrade flake8
      - name: Run flake8
        # Pinned to v4.0.0.
        uses: liskin/gh-problem-matcher-wrap@d31bb388d13cf879e93f878cb2550299f0afb460
        with:
          linters: flake8
          run: flake8

  isort:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install isort
      - name: isort
        # Pinned to v4.0.0.
        uses: liskin/gh-problem-matcher-wrap@d31bb388d13cf879e93f878cb2550299f0afb460
        with:
          linters: isort
          run: isort --check --diff aldryn_sso

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        requirements: ["dj42_cms311", "dj52", "dj60", "dj61"]
        exclude:
          - python-version: "3.13"
            requirements: "dj42_cms311"
          - python-version: "3.14"
            requirements: "dj42_cms311"
          - python-version: "3.10"
            requirements: "dj60"
          - python-version: "3.11"
            requirements: "dj60"
          - python-version: "3.10"
            requirements: "dj61"
          - python-version: "3.11"
            requirements: "dj61"
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -U packaging setuptools
          pip install -r tests/requirements/${{ matrix.requirements }}.txt
          python -m pip install -e .
      - name: Run coverage
        run: coverage run tests/settings.py
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v7
